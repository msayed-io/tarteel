function getToday(schedule,now=Date.now()){if(!schedule?.timezone||!Array.isArray(schedule.events))return[];const key=localDateKey(now,schedule.timezone);return schedule.events.filter(event=>event.date===key)}
function renderPrayer(){const schedule=prayerState.schedule,now=Date.now(),next=findNext(schedule,now),list=$('#plist'),label=$('#plab'),name=$('#pnm'),time=$('#pcd'),ring=$('#prayerCountRing');if(!schedule||!next){label.textContent='المواقيت غير متاحة';label.title=prayerState.refreshError||'اختر موقعًا وطريقة حساب من إعدادات الصلاة';name.textContent='—';time.textContent='—';ring.style.setProperty('--progress','0%');ring.setAttribute('aria-label','لا توجد مواقيت مؤكدة');list.replaceChildren();refreshIdle();return}
  const todayKey=localDateKey(now,schedule.timezone),manual=schedule.locationSource==='manual',stale=!!schedule.stale;label.textContent=`${manual?'القادمة · يدوي':'الصلاة القادمة'}${next.date!==todayKey?' · غدًا':''}${stale?' · محفوظ':''}`;label.title=`${schedule.locationLabel||''}${schedule.timezone?` · ${schedule.timezone}`:''}${stale?` · ${schedule.refreshError||'جدول محفوظ من المصدر'} `:''}`;name.textContent=next.name;time.textContent=countdown(next.at-now);ring.setAttribute('aria-label',`${countdown(next.at-now)} متبقي حتى صلاة ${next.name}`);
  const index=schedule.events.findIndex(event=>event.id===next.id),previous=index>0?schedule.events[index-1]:null;const progress=previous&&next.at>previous.at?clamp((now-previous.at)/(next.at-previous.at),0,1)*100:0;ring.style.setProperty('--progress',`${progress.toFixed(2)}%`);
  const today=getToday(schedule,now),signature=today.map(event=>event.id).join('|'),old=list.dataset.signature||'';if(signature!==old){list.dataset.signature=signature;list.replaceChildren(...today.map(event=>{const row=document.createElement('div');row.className='pr';row.dataset.id=event.id;const prayer=document.createElement('b'),stateText=document.createElement('em'),timeText=document.createElement('span');prayer.textContent=event.name;row.append(prayer,stateText,timeText);return row}))}
  const previousToday=[...today].reverse().find(event=>event.at<=now);[...list.children].forEach(row=>{const event=today.find(item=>item.id===row.dataset.id);if(!event)return;const isNext=event.id===next.id,isCurrent=event.id===previousToday?.id;row.children[1].textContent=isNext?'القادمة':isCurrent?'الحالية':'';row.children[2].textContent=formatPrayerTime(event.at,schedule.timezone);row.classList.toggle('nxt',isNext);row.classList.toggle('past',event.at<=now&&!isNext&&!isCurrent)});refreshIdle()}
function refreshIdle(){const next=findNext(prayerState.schedule,Date.now()),show=Boolean(prayerState.preferences.showNext&&next);$('#idlePrayerName').textContent=show?next.name:'';$('#idlePrayer').setAttribute('aria-label',show?`الصلاة القادمة ${next.name} — فتح مواقيت الصلاة`:'فتح مواقيت الصلاة');isl.setAttribute('aria-label',show?`Dynamic Island — الصلاة القادمة ${next.name}`:'Dynamic Island — فتح مواقيت الصلاة')}
function renderPlayer(){tc.textContent=fmt(player.position);rem.textContent='−'+fmt(Math.max(0,player.duration-player.position));fill.style.width=`${player.duration?clamp(player.position/player.duration,0,1)*100:0}%`;bar.setAttribute('aria-valuemax',String(player.duration));bar.setAttribute('aria-valuenow',String(Math.round(player.position)));$('#ttl').textContent=player.fileName||'';$('#sub').textContent=player.artist||'';for(const art of [$('#compactArt'),$('#fullArt')]){art.style.backgroundImage=player.cover?`url("${String(player.cover).replaceAll('"','%22')}")`:'';art.style.backgroundSize=player.cover?'cover':''}isl.classList.toggle('paused',!player.playing);pp.setAttribute('aria-label',player.playing?'إيقاف مؤقت':'تشغيل');syncTools()}
function syncTools(){const speed=Number(player.speed)||1;$$('#chSpeed button').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.v)===speed)));const audioSleep=player.sleepMode==='minutes'?String(player.sleepMinutes):player.sleepMode==='end'?'end':'0';$$('#chSleep button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.v===audioSleep)));$('#swCount').setAttribute('aria-checked',String(Boolean(prayerState.preferences.showNext)));$('#swPause').setAttribute('aria-checked',String(Boolean(prayerState.preferences.pauseAtAdhan)))}
function seek(event){const rect=bar.getBoundingClientRect();if(!rect.width||!player.duration)return;const position=clamp((event.clientX-rect.left)/rect.width,0,1)*player.duration;player.position=position;renderPlayer();control('seek',{position})}
function hold(button,tap,long){let timer=0,fired=false,cancelled=false;button.addEventListener('pointerdown',event=>{if(event.button!==undefined&&event.button!==0)return;fired=false;cancelled=false;try{button.setPointerCapture(event.pointerId)}catch{}timer=setTimeout(()=>{fired=true;long();button.animate([{scale:1.18},{scale:1}],{duration:260,easing:'cubic-bezier(.2,.9,.3,1)'})},520)});button.addEventListener('pointerup',event=>{clearTimeout(timer);try{button.releasePointerCapture(event.pointerId)}catch{}if(!fired&&!cancelled)tap()});['pointerleave','pointercancel'].forEach(type=>button.addEventListener(type,()=>{clearTimeout(timer);cancelled=true}));button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();tap()}})}
function restoreAlert(record){if(!record?.id||!record?.name)return;showAdhan(record)}
function showAdhan(record){if(state==='alert'&&prayerState.alert?.id===record.id)return;prayerState.alert=record;$('#alT').textContent=`حان وقت صلاة ${record.name}`;$('#alS').textContent=record.resumeDisabled?'انتهى مؤقت النوم؛ لن تُستأنف التلاوة تلقائيًا.':record.pausedByAdhan?'أُوقفت التلاوة مؤقتًا':record.wasPlaying?'وصل تنبيه الصلاة والتلاوة مستمرة':'حسب المواقيت المؤكدة';$('#alR').hidden=!record.pausedByAdhan||Boolean(record.resumeDisabled);if(state!=='alert')back=state==='tools'?'compact':state;go('alert');clearTimeout(alertTimer);alertTimer=setTimeout(()=>dismissAlert(true),25000)}
function dismissAlert(notifyMain){clearTimeout(alertTimer);const was=state==='alert';if(was)go(back||'compact');prayerState.alert=null;if(notifyMain)control('dismiss-adhan');if(was)emit('island-state',{state}).catch(()=>{})}
function setPrayerData(data){prayerState.schedule=data?.schedule||null;prayerState.preferences={...prayerState.preferences,...(data?.preferences||{})};if(data?.alert){prayerState.alert=data.alert;if(state==='alert'){$('#alS').textContent=data.alert.resumeDisabled?'انتهى مؤقت النوم؛ لن تُستأنف التلاوة تلقائيًا.':data.alert.pausedByAdhan?'أُوقفت التلاوة مؤقتًا':data.alert.wasPlaying?'وصل تنبيه الصلاة والتلاوة مستمرة':'حسب المواقيت المؤكدة';$('#alR').hidden=!data.alert.pausedByAdhan||Boolean(data.alert.resumeDisabled)}}renderPrayer();syncTools()}

// Preserve the reference transitions and the original idle/compact/full art while adding only its prayer states.
isl.addEventListener('pointerdown',event=>{if(!event.target.closest('.ctl,.bar,.tbtn,.tools,.alert,.idle-prayer'))isl.classList.add('press')});addEventListener('pointerup',()=>isl.classList.remove('press'));
isl.addEventListener('click',event=>{if(event.target.closest('.ctl,.bar,.tbtn,.tools,.alert'))return;if(state==='idle')go('prayer');else if(state==='compact')go('full');else if(state==='full')go('compact');else if(state==='prayer')go('idle');else if(state==='tools')go('full')});isl.addEventListener('keydown',event=>{if(event.target===isl&&(event.key==='Enter'||event.key===' ')){event.preventDefault();isl.click()}});
addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(state==='alert')dismissAlert(true);else{const next={tools:'full',full:'compact',compact:'idle',prayer:'idle'}[state];if(next)go(next)}});
document.addEventListener('pointerdown',event=>{if(isl.contains(event.target))return;if(state==='full'||state==='tools')go('compact');else if(state==='prayer')go('idle')});
$('#pp').addEventListener('click',()=>control('toggle'));hold($('#bk'),()=>control('seek-by',{seconds:-15}),()=>control('previous'));hold($('#fw'),()=>control('seek-by',{seconds:15}),()=>control('next'));
bar.addEventListener('pointerdown',event=>{scrub=true;bar.setPointerCapture(event.pointerId);bar.classList.add('on');seek(event)});bar.addEventListener('pointermove',event=>{if(scrub)seek(event)});const endScrub=()=>{scrub=false;bar.classList.remove('on')};bar.addEventListener('pointerup',endScrub);bar.addEventListener('pointercancel',endScrub);bar.addEventListener('keydown',event=>{if(event.key!=='ArrowRight'&&event.key!=='ArrowLeft')return;event.preventDefault();const position=clamp(player.position+(event.key==='ArrowRight'?5:-5),0,player.duration);player.position=position;renderPlayer();control('seek',{position})});
$('#tb').addEventListener('click',()=>go('tools'));$('#tback').addEventListener('click',()=>go('full'));
$('#chSpeed').addEventListener('click',event=>{const button=event.target.closest('button[data-v]');if(button)control('set-speed',{value:Number(button.dataset.v)})});$('#chSleep').addEventListener('click',event=>{const button=event.target.closest('button[data-v]');if(button)control('set-sleep',{value:button.dataset.v})});
$('#swCount').addEventListener('click',()=>control('set-prayer-preference',{key:'showNext',value:!prayerState.preferences.showNext}));$('#swPause').addEventListener('click',()=>control('set-prayer-preference',{key:'pauseAtAdhan',value:!prayerState.preferences.pauseAtAdhan}));
$('#alD').addEventListener('click',()=>dismissAlert(true));$('#alR').addEventListener('click',()=>control('resume-after-adhan'));
function fitTools(){const available=Math.max(220,Math.min(430,(screen.availHeight||900)-96));toolsEl.style.setProperty('--tmax',`${available}px`);TARGET.tools[1]=Math.max(220,Math.min(430,Math.ceil(toolsEl.offsetHeight||available)));if(state==='tools'){S.h.t=TARGET.tools[1];kick()}}
addEventListener('resize',()=>{fitToScreen();fitTools()});

listen('player-state',event=>{const data=event.payload||{};player={...player,...data,position:Math.max(0,Number(data.position)||0),duration:Math.max(0,Number(data.duration)||0),speed:Number(data.speed)||1,sleepMode:data.sleepMode||'off'};renderPlayer();if(!data.fileName&&state==='compact')go('idle');else if(data.fileName&&state==='idle')go('compact')}).catch(cause=>console.error('Tarteel island player-state listener failed',cause));
listen('prayer-data',event=>setPrayerData(event.payload||{})).catch(cause=>console.error('Tarteel island prayer-data listener failed',cause));
listen('prayer-adhan',event=>showAdhan(event.payload||{})).catch(cause=>console.error('Tarteel island adhan listener failed',cause));
listen('prayer-alarm-restore',event=>restoreAlert(event.payload||{})).catch(cause=>console.error('Tarteel island alarm restore listener failed',cause));
listen('prayer-resumed',()=>dismissAlert(false)).catch(cause=>console.error('Tarteel island resume listener failed',cause));
listen('prayer-resume-failed',event=>{$('#alS').textContent=event.payload?.message||'تعذر الاستئناف؛ لن يبدأ الصوت تلقائيًا.'}).catch(cause=>console.error('Tarteel island resume-failure listener failed',cause));
listen('sleep-deadline',()=>{player.sleepMode='off';syncTools()}).catch(cause=>console.error('Tarteel island sleep listener failed',cause));
let mainReady=false;const readyRetry=setInterval(()=>{if(mainReady){clearInterval(readyRetry);return}emit('island-ready').catch(cause=>console.error('Tarteel island readiness retry failed',cause))},500);
listen('main-ready',()=>{mainReady=true;clearInterval(readyRetry)}).catch(cause=>console.error('Tarteel main-ready listener failed',cause));
setInterval(()=>{renderPrayer()},1000);
fitTools();fitToScreen();apply();renderPlayer();renderPrayer();syncTools();emit('island-ready').catch(cause=>console.error('Tarteel island ready event failed',cause));
</script>
</body>
