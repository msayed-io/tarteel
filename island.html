<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تَرتيل</title>
<style>
:root{--black:#000;--rim:1;--rim-system:1;--text:#fff;--sub:rgba(235,235,245,.6);--track:rgba(235,235,245,.3);--fill:#9d9da1;--ctl:#dcdce1;--accent:#5AA9FF;--chip:rgba(255,255,255,.1);--chip-on:rgba(255,255,255,.22);--green:var(--accent);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;--ease-out:cubic-bezier(.2,.9,.3,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:transparent;color:var(--text);-webkit-font-smoothing:antialiased}body{font-family:var(--font)}button{font-family:inherit}
.island{position:fixed;top:7px;left:0;translate:0 0;width:44px;height:24px;border-radius:12px;background:transparent;overflow:visible;cursor:pointer;transform-origin:50% 0;user-select:none;scale:var(--fit,1);will-change:width,height,border-radius;transition:scale .28s var(--ease-out);z-index:1}
.island-surface{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:transparent;z-index:1}
.island.press{scale:calc(var(--fit,1)*.965)}.island:focus-visible{outline:2px solid #5aa9ff;outline-offset:3px}
.layer{position:absolute;top:0;left:50%;opacity:0;filter:blur(14px);pointer-events:none;transform-origin:50% 0;transition:opacity .14s ease-in,filter .14s ease-in,transform .22s ease-in}
.idle{left:0;width:100%;height:24px;margin-left:0;transform:scale(.8);display:flex;align-items:center;justify-content:center}
.compact{left:0;width:100%;height:24px;margin-left:0;transform:scale(.8)}
.full{width:480px;height:262px;margin-left:-240px;transform:scale(.72)}
.tools{width:480px;height:auto;max-height:var(--tmax,430px);margin-left:-240px;transform:scale(.9);padding:0 24px 24px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.alert{width:440px;height:92px;margin-left:-220px;transform:scale(.9);padding:0 22px;display:flex;align-items:center;gap:14px}
[data-state=idle] .idle,[data-state=compact] .compact,[data-state=full] .full,[data-state=prayer] .prayer,[data-state=tools] .tools,[data-state=alert] .alert{opacity:1;filter:blur(0);transform:scale(1);pointer-events:auto;transition:opacity .32s .12s ease-out,filter .32s .12s ease-out,transform .5s .08s var(--ease-out)}
[data-state=full] .full{transform:scale(.8)}
[data-state=prayer] .prayer,[data-state=tools] .tools,[data-state=alert] .alert{transform:scale(.9)}
.art{position:absolute;border-radius:14px;background:radial-gradient(circle at 70% 28%,#ffd9a0 0 8%,transparent 9%),linear-gradient(180deg,#f2a65a 0%,#d4582f 45%,#6d2a2e 70%,#1d2a52 100%);background-position:center;background-size:cover;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.compact .art{left:6px;top:4px;width:16px;height:16px;border-radius:4.5px}.full .art{left:18px;top:27px;width:90px;height:90px}
.wave{position:absolute;display:flex;align-items:center;justify-content:space-between;color:var(--accent)}
.wave i{display:block;width:3px;height:100%;border-radius:2px;background:currentColor;transform-origin:50% 50%;animation:eq .9s ease-in-out infinite alternate;transition:transform .35s var(--ease-out)}
.wave i:nth-child(1){animation-duration:.8s;animation-delay:-.2s}.wave i:nth-child(2){animation-duration:.6s;animation-delay:-.5s}.wave i:nth-child(3){animation-duration:1s;animation-delay:-.1s}.wave i:nth-child(4){animation-duration:.7s;animation-delay:-.7s}.wave i:nth-child(5){animation-duration:.9s;animation-delay:-.35s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}.paused .wave i{animation:none;transform:scaleY(.2)}.compact .wave{right:9px;top:5px;width:15px;height:13px}.full .wave{right:27px;top:64px;width:28px;height:16px}
.idle-prayer{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:#fff;font:600 8.5px/1 var(--font);white-space:nowrap;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s ease,filter .2s ease}
[data-state=idle] .idle-prayer{opacity:1;pointer-events:auto}#idlePrayerName{display:block;max-width:100%;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.title,.artist{position:absolute;left:124px;right:76px;font-size:22px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;unicode-bidi:plaintext}
.title{top:62px;font-weight:600;letter-spacing:-.01em;transition:opacity .15s}.artist{top:90px;font-weight:400;color:var(--sub)}
.t{position:absolute;top:139px;font-size:15px;line-height:18px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}#tc{left:20px}#tr{right:20px}
.bar{position:absolute;left:73px;width:322px;top:134px;height:30px;touch-action:none;cursor:pointer}.bar .track{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:4px;background:var(--track);overflow:hidden;transition:top .25s var(--ease-out),height .25s var(--ease-out),border-radius .25s}.bar .fill{height:100%;width:0;background:var(--fill);border-radius:inherit}.bar.on .track{top:10px;height:12px;border-radius:6px}.bar.on .fill{background:#e6e6ea}
.ctl{position:absolute;top:164px;width:96px;height:96px;display:grid;place-items:center;background:none;border:0;color:var(--ctl);cursor:pointer;transition:scale .2s var(--ease-out),opacity .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.ctl:active{scale:.88;opacity:.7}.ctl:focus-visible,.tbtn:focus-visible,.chips button:focus-visible,.sw:focus-visible,.pill:focus-visible{outline:2px solid #5aa9ff;outline-offset:1px}.ctl svg{display:block;fill:currentColor;stroke:currentColor;stroke-linejoin:round}#bk{left:60px}#pp{left:192px}#fw{left:322px}.pp .ico{grid-area:1/1;transition:opacity .22s,scale .3s var(--ease-out)}.pp .play{opacity:0;scale:.6}.paused .pp .play{opacity:1;scale:1}.paused .pp .pause{opacity:0;scale:.6}
.tbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border:0;background:none;color:var(--sub);cursor:pointer;border-radius:12px;transition:color .2s,scale .2s var(--ease-out)}.tbtn:active{scale:.88;color:#fff}.tbtn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#tb{position:absolute;left:412px;top:192px}
.th{position:relative;height:52px;display:flex;align-items:center;justify-content:center}.th b{position:absolute;left:0;right:auto;top:50%;transform:translateY(-50%);font-size:17px;font-weight:600;text-align:left;white-space:nowrap}.th .tbtn{position:absolute;right:-10px;top:6px;color:var(--ctl)}.sec{margin-top:14px}.th+.sec{margin-top:6px}.sec>label{display:block;font-size:13px;line-height:19px;font-weight:600;color:var(--sub);margin:0 4px 7px}.chips{display:flex;gap:6px}.chips button{flex:1;height:32px;border:0;border-radius:10px;background:var(--chip);color:var(--sub);font:600 13px var(--font);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}.chips button[aria-pressed=true]{background:var(--chip-on);color:#fff}.rows{display:flex;gap:8px}
.sw{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 12px;border:0;border-radius:12px;background:var(--chip);color:#fff;font:600 13px var(--font);cursor:pointer;text-align:start}.sw i{flex:none;position:relative;width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.25);transition:background .25s}.sw i::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .25s var(--ease-out)}.sw[aria-checked=true] i{background:var(--green)}.sw[aria-checked=true] i::after{right:16px}
.alert .tx{flex:1;min-width:0}.alert h3{font:600 19px/24px var(--font)}.alert p{font:400 14px/19px var(--font);color:var(--sub)}.pill{height:34px;padding:0 16px;border:0;border-radius:999px;background:var(--chip-on);color:#fff;font:600 14px var(--font);cursor:pointer;transition:scale .2s var(--ease-out)}.pill:active{scale:.94}.pill.main{background:#fff;color:#000}.pill.stop{border:1px solid rgba(90,169,255,.28);background:rgba(90,169,255,.14);color:#5AA9FF}.pill[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleY(.6)}}

.rim{position:relative}.rim::after{content:"";position:absolute;inset:var(--rim-inset-top,0px) var(--rim-inset-right,0px) var(--rim-inset-bottom,0px) var(--rim-inset-left,0px);box-sizing:border-box;pointer-events:none;opacity:var(--rim-effective,var(--rim,1));background-image:var(--rim-image);background-size:100% 100%}

@media(prefers-reduced-transparency:reduce){.rim{--rim-system:.5}}

/* ===== زجاج سفلي (LiquidGlass2) — الأوضاع الموسعة فقط =====
   القيم من ملف Windhawk: Blur 3–5 + TintSaturation 1.2 + صبغة #14090909،
   بدون أي إطار أو لمعة على الحواف (حسب الطلب). */
@property --gs{syntax:'<percentage>';inherits:true;initial-value:100%}
@property --gf{syntax:'<percentage>';inherits:true;initial-value:0%}
.island-surface{--gs:100%;--gf:0%;transition:--gs .6s var(--ease-out),--gf .6s var(--ease-out)}
[data-state=full] .island-surface{--gs:28%;--gf:38%}
[data-state=prayer] .island-surface{--gs:30%;--gf:42%}
[data-state=tools] .island-surface{--gs:28%;--gf:40%}
[data-state=alert] .island-surface{--gs:40%;--gf:36%}
.glass,.glass>*{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.g-blur{-webkit-backdrop-filter:none;backdrop-filter:none;transition:backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease}
:is([data-state=full],[data-state=prayer],[data-state=tools],[data-state=alert]) .g-blur{-webkit-backdrop-filter:blur(6px) saturate(1.25) brightness(.72);backdrop-filter:blur(6px) saturate(1.25) brightness(.72)}
.g-tint{background:linear-gradient(180deg,rgba(9,9,9,.32),rgba(9,9,9,.22))}
.g-black{background:#000;-webkit-mask-image:linear-gradient(to bottom,#000 var(--gs),rgba(0,0,0,0.957) calc(var(--gs) + var(--gf)*0.125),rgba(0,0,0,0.844) calc(var(--gs) + var(--gf)*0.25),rgba(0,0,0,0.684) calc(var(--gs) + var(--gf)*0.375),rgba(0,0,0,0.5) calc(var(--gs) + var(--gf)*0.5),rgba(0,0,0,0.316) calc(var(--gs) + var(--gf)*0.625),rgba(0,0,0,0.156) calc(var(--gs) + var(--gf)*0.75),rgba(0,0,0,0.043) calc(var(--gs) + var(--gf)*0.875),transparent calc(var(--gs) + var(--gf)*1));mask-image:linear-gradient(to bottom,#000 var(--gs),rgba(0,0,0,0.957) calc(var(--gs) + var(--gf)*0.125),rgba(0,0,0,0.844) calc(var(--gs) + var(--gf)*0.25),rgba(0,0,0,0.684) calc(var(--gs) + var(--gf)*0.375),rgba(0,0,0,0.5) calc(var(--gs) + var(--gf)*0.5),rgba(0,0,0,0.316) calc(var(--gs) + var(--gf)*0.625),rgba(0,0,0,0.156) calc(var(--gs) + var(--gf)*0.75),rgba(0,0,0,0.043) calc(var(--gs) + var(--gf)*0.875),transparent calc(var(--gs) + var(--gf)*1))}
:is([data-state=full],[data-state=prayer],[data-state=tools],[data-state=alert]){--sub:rgba(235,235,245,.82);--track:rgba(235,235,245,.42);--chip:rgba(255,255,255,.15);--chip-on:rgba(255,255,255,.3)}
:is([data-state=full],[data-state=prayer],[data-state=tools],[data-state=alert]) .layer{text-shadow:0 1px 6px rgba(0,0,0,.32)}

/* ===== المواقيت — تصميم جديد: لون دافئ لكل صلاة + عدّاد أرقام + شريط تقدّم ===== */
.prayer{width:444px;height:188px;margin-left:-222px;transform:scale(.9);padding:18px 22px;display:flex;gap:14px;--t1:#FFE08A;--t2:#FFB020}
.prayer[data-tone=fajr]{--t1:#C9B8FF;--t2:#FF8FCB}.prayer[data-tone=sunrise]{--t1:#FFD8B0;--t2:#FF9F7A}
.prayer[data-tone=dhuhr]{--t1:#FFE69A;--t2:#FFB020}.prayer[data-tone=asr]{--t1:#FFCB8A;--t2:#FF8A3D}
.prayer[data-tone=maghrib]{--t1:#FFA494;--t2:#FF4D8D}.prayer[data-tone=isha]{--t1:#7CF5D8;--t2:#1FB6A0}
.ph{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:9px}
.ph-top{display:flex;align-items:center;gap:7px;font:600 12px/16px var(--font);color:var(--sub);white-space:nowrap}
.ph-dot{flex:none;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 0 9px var(--t2)}
.ph-row{display:flex;align-items:baseline;gap:9px;min-width:0}
.ph-name{margin:0;font:700 29px/34px var(--font);letter-spacing:-.01em;white-space:nowrap}
.ph-count{display:flex;flex-direction:column;gap:10px}
.ph-digits{display:flex;align-items:flex-start;gap:5px;direction:ltr}
.ph-digits span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:38px}
.ph-digits b{font:700 33px/32px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ph-digits span:last-of-type b{color:var(--t1)}
.ph-digits small{font:600 9.5px/1 var(--font);color:var(--sub)}
.ph-digits i{font:600 24px/32px var(--font);font-style:normal;color:rgba(255,255,255,.38)}
.ph-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.ph-bar i{display:block;height:100%;width:var(--progress,0%);border-radius:inherit;background:linear-gradient(90deg,var(--t2),var(--t1));box-shadow:0 0 12px var(--t2);transition:width 1s linear}
.plist{flex:none;width:216px;padding:6px;border-radius:20px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06))}
.pr{height:28px;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:14px;font:600 14px/1 var(--font);transition:background .3s,opacity .3s}
.pr b{flex:none;font-weight:600}
.pr em{flex:1;font:600 10px/1 var(--font);color:var(--sub)}
.pr span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.past{opacity:.5}
.pr.nxt{background:rgba(255,255,255,.22);background:linear-gradient(90deg,color-mix(in srgb,var(--t2) 46%,transparent),color-mix(in srgb,var(--t1) 24%,transparent))}
.pr.nxt em{color:var(--t1)}.pr.nxt span{color:#fff}
@media(prefers-reduced-transparency:reduce){.island-surface{--gs:100%!important;--gf:0%!important}}
</style>
</head>
<body>
<div id="isl" class="island" data-state="idle" role="button" tabindex="0" aria-label="Dynamic Island — فتح مواقيت الصلاة" aria-expanded="false">
  <div class="island-surface">
  <div class="glass" aria-hidden="true"><i class="g-blur"></i><i class="g-tint"></i><i class="g-black"></i></div>
  <div class="layer idle" data-s="idle" dir="rtl" aria-hidden="false"><button class="idle-prayer rim" id="idlePrayer" aria-label="فتح مواقيت الصلاة"><span id="idlePrayerName"></span></button></div>
  <div class="layer compact" data-s="compact" aria-hidden="true"><div class="art" id="compactArt"></div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="layer full" data-s="full" aria-hidden="true" inert>
    <div class="art" id="fullArt"></div><div class="title" id="ttl"></div><div class="artist" id="sub"></div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="t" id="tc">٠:٠٠</span><span class="t" id="tr">−٠:٠٠</span>
    <div class="bar" id="bar" role="slider" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><div class="track"><div class="fill" id="fill"></div></div></div>
    <button class="ctl" id="bk" aria-label="المقطع السابق" title="اضغط مطولًا للتلاوة السابقة"><svg width="48" height="30" viewBox="0 0 48 30" stroke-width="4"><path d="M23 3 4 15l19 12ZM45 3 26 15l19 12Z"/></svg></button>
    <button class="ctl pp" id="pp" aria-label="تشغيل"><svg class="ico pause" width="36" height="48" viewBox="0 0 36 48" stroke="none"><rect width="14" height="48" rx="4"/><rect x="22" width="14" height="48" rx="4"/></svg><svg class="ico play" width="38" height="48" viewBox="0 0 38 48" stroke-width="8"><path d="M6 6 33 24 6 42Z"/></svg></button>
    <button class="ctl" id="fw" aria-label="المقطع التالي" title="اضغط مطولًا للتلاوة التالية"><svg width="48" height="30" viewBox="0 0 48 30" stroke-width="4"><path d="M3 3l19 12L3 27ZM25 3l19 12-19 12Z"/></svg></button>
    <button class="tbtn rim" id="tb" aria-label="الأدوات"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h11M21 17h-1"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="17" r="2.5"/></svg></button>
  </div>
  <div class="layer prayer" data-s="prayer" dir="rtl" aria-hidden="true" role="group" aria-label="مواقيت الصلاة">
    <section class="ph" aria-label="الصلاة القادمة">
      <div class="ph-top"><i class="ph-dot"></i><span id="plab">المواقيت غير متاحة</span></div>
      <div class="ph-row"><h2 class="ph-name" id="pnm">—</h2></div>
      <div class="ph-count" id="prayerCountRing" role="timer" aria-live="off" aria-label="الوقت المتبقي غير متاح">
        <div class="ph-digits"><span><b id="pcH">--</b><small>ساعة</small></span><i>:</i><span><b id="pcM">--</b><small>دقيقة</small></span><i>:</i><span><b id="pcS">--</b><small>ثانية</small></span></div>
        <div class="ph-bar"><i></i></div>
      </div>
      <span id="pcd" hidden></span>
    </section>
    <div class="plist" id="plist" aria-label="جدول اليوم"></div>
  </div>
  <div class="layer tools" data-s="tools" dir="rtl" aria-hidden="true">
    <div class="th"><b>الأدوات</b><button class="tbtn rim" id="tback" aria-label="رجوع"><svg width="22" height="22" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <div class="sec"><label>السرعة</label><div class="chips" id="chSpeed"><button class="rim" data-v="0.75" aria-pressed="false">0.75×</button><button class="rim" data-v="1" aria-pressed="true">1×</button><button class="rim" data-v="1.25" aria-pressed="false">1.25×</button><button class="rim" data-v="1.5" aria-pressed="false">1.5×</button></div></div>
    <div class="sec"><label>مؤقت النوم</label><div class="chips" id="chSleep"><button class="rim" data-v="0" aria-pressed="true">إيقاف</button><button class="rim" data-v="15" aria-pressed="false">15 د</button><button class="rim" data-v="30" aria-pressed="false">30 د</button><button class="rim" data-v="60" aria-pressed="false">60 د</button><button class="rim" data-v="end" aria-pressed="false">نهاية السورة</button></div></div>
    <div class="sec"><label>إعدادات الصلاة</label><div class="rows"><button class="sw" id="swCount" role="switch" aria-checked="false"><span>عرض الصلاة القادمة</span><i></i></button><button class="sw" id="swPause" role="switch" aria-checked="true"><span>إيقاف التلاوة عند الأذان</span><i></i></button></div></div>
  </div>
  <div class="layer alert" data-s="alert" dir="rtl" aria-hidden="true" role="alert"><div class="tx"><h3 id="alT"></h3><p id="alS"></p></div><button class="pill stop rim" id="alStop" hidden>إيقاف الأذان</button><button class="pill rim" id="alR" hidden>استئناف</button><button class="pill main rim" id="alD">تم</button></div>
  </div>
</div>
<script type="module">
import { emit, listen } from '@tauri-apps/api/event';
import { invoke } from '@tauri-apps/api/core';
import { compactTopInset, contentViewportSize, nativeWindowSize, requiredViewportHeight } from './src/engine/island-geometry.js';
import { installSpecularRim } from './src/lib/specular-rim.js';
import { applyRimIntensity, readRimIntensity } from './src/lib/rim-preference.js';
applyRimIntensity(readRimIntensity(), document);
installSpecularRim(document);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],isl=$('#isl'),fill=$('#fill'),tc=$('#tc'),rem=$('#tr'),bar=$('#bar'),pp=$('#pp'),toolsEl=$('.layer.tools');

listen('prayer-resume-failed',event=>{$('#alS').textContent=event.payload?.message||'تعذر الاستئناف؛ لن يبدأ الصوت تلقائيًا.'}).catch(cause=>console.error('Tarteel island resume-failure listener failed',cause));
listen('sleep-deadline',()=>{player.sleepMode='off';syncTools()}).catch(cause=>console.error('Tarteel island sleep listener failed',cause));
let mainReady=false;const readyRetry=setInterval(()=>{if(mainReady){clearInterval(readyRetry);return}emit('island-ready').catch(cause=>console.error('Tarteel island readiness retry failed',cause))},500);
listen('main-ready',()=>{mainReady=true;clearInterval(readyRetry)}).catch(cause=>console.error('Tarteel main-ready listener failed',cause));
setInterval(()=>{renderPrayer()},1000);
fitTools();fitToScreen();apply();renderPlayer();renderPrayer();syncTools();emit('island-ready').catch(cause=>console.error('Tarteel island ready event failed',cause));
</script>
