[package]
name = "tarteel"
version = "0.5.1"
description = "تَرتيل - مشغل التلاوات المحلي"
authors = ["Tarteel"]
edition = "2021"

[lib]
name = "tarteel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.5.1"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
lofty = "0.22"
base64 = "0.22"
thiserror = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The island applies position and size in one SetWindowPos call so the capsule can never
# render half-shifted. That needs the Win32 WindowsAndMessaging bindings.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Time",
  # إشعارات المنبّه: WinRT + COM لإنشاء اختصار قائمة ابدأ الذي يطلبه ويندوز.
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Data_Xml_Dom",
  "UI_Notifications",
] }
