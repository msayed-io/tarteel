[package]
name = "tarteel"
version = "0.1.0"
description = "تَرتيل - مشغل التلاوات المحلي"
authors = ["Tarteel"]
edition = "2021"

[lib]
name = "tarteel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
lofty = "0.22"
base64 = "0.22"
thiserror = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
