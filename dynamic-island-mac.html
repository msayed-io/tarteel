<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Island — MacBook Pro replica</title>
<style>
:root{
  --black:#000; --text:#fff; --sub:rgba(235,235,245,.6); --track:rgba(235,235,245,.3);
  --fill:#9d9da1; --ctl:#dcdce1; --accent:#b88ad8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#b9c6d8;overflow:hidden;color:var(--text);-webkit-font-smoothing:antialiased}
.wall{position:fixed;inset:0;filter:blur(1.2px);
  background:repeating-linear-gradient(90deg,#eaf0f8 0 7px,#a9bad2 7px 12px,#f6f8fc 12px 17px,#7f95b6 17px 20px,#dde6f2 20px 29px,#c3d0e3 29px 33px)}

/* ---------- Island shell ---------- */
.island{position:fixed;top:10px;left:50%;translate:-50% 0;width:64px;height:34px;border-radius:17px;
  background:var(--black);overflow:hidden;cursor:pointer;transform-origin:50% 0;user-select:none;
  scale:var(--fit,1);transition:scale .28s var(--ease-out);will-change:width,height,border-radius;
  box-shadow:0 calc(var(--p,0)*18px) calc(var(--p,0)*50px) rgba(0,0,0,calc(var(--p,0)*.38))}
.island.press{scale:calc(var(--fit,1)*.965)}
.island:focus-visible{outline:2px solid #5aa9ff;outline-offset:3px}

/* ---------- Content layers (blur + scale crossfade) ---------- */
.layer{position:absolute;top:0;left:50%;opacity:0;filter:blur(14px);pointer-events:none;
  transition:opacity .14s ease-in,filter .14s ease-in,transform .22s ease-in}
.compact{width:144px;height:34px;margin-left:-72px;transform:scale(.8)}
.full{width:480px;height:262px;margin-left:-240px;transform:scale(.88);transform-origin:50% 0}
[data-state=compact] .compact,[data-state=full] .full{opacity:1;filter:blur(0);transform:scale(1);pointer-events:auto;
  transition:opacity .32s .12s ease-out,filter .32s .12s ease-out,transform .5s .08s var(--ease-out)}

.art{position:absolute;border-radius:14px;
  background:radial-gradient(circle at 70% 28%,#ffd9a0 0 8%,transparent 9%),
  linear-gradient(180deg,#f2a65a 0%,#d4582f 45%,#6d2a2e 70%,#1d2a52 100%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.compact .art{left:9px;top:6px;width:22px;height:22px;border-radius:6px}
.full .art{left:18px;top:27px;width:90px;height:90px}

.wave{position:absolute;display:flex;align-items:center;justify-content:space-between;color:var(--accent)}
.wave i{display:block;width:3px;height:100%;border-radius:2px;background:currentColor;transform-origin:50% 50%;
  animation:eq .9s ease-in-out infinite alternate;transition:transform .35s var(--ease-out)}
.wave i:nth-child(1){animation-duration:.8s;animation-delay:-.2s}
.wave i:nth-child(2){animation-duration:.6s;animation-delay:-.5s}
.wave i:nth-child(3){animation-duration:1s;animation-delay:-.1s}
.wave i:nth-child(4){animation-duration:.7s;animation-delay:-.7s}
.wave i:nth-child(5){animation-duration:.9s;animation-delay:-.35s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.paused .wave i{animation:none;transform:scaleY(.2)}
.compact .wave{right:14px;top:9px;width:20px;height:16px}
.full .wave{right:27px;top:64px;width:28px;height:16px}

.title{position:absolute;left:124px;right:76px;top:62px;font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{position:absolute;left:124px;right:76px;top:90px;font-size:22px;line-height:26px;font-weight:400;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.t{position:absolute;top:139px;font-size:15px;line-height:18px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
#tc{left:20px}#tr{right:20px}
.bar{position:absolute;left:73px;width:322px;top:134px;height:30px;touch-action:none;cursor:pointer}
.bar .track{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:4px;background:var(--track);overflow:hidden;
  transition:top .25s var(--ease-out),height .25s var(--ease-out),border-radius .25s}
.bar .fill{height:100%;width:63%;background:var(--fill);border-radius:inherit}
.bar.on .track{top:10px;height:12px;border-radius:6px}
.bar.on .fill{background:#e6e6ea}

.ctl{position:absolute;top:0;width:96px;height:96px;display:grid;place-items:center;background:none;border:0;color:var(--ctl);cursor:pointer;
  transition:scale .2s var(--ease-out),opacity .2s}
.ctl:active{scale:.88;opacity:.7}
.ctl:focus-visible{outline:2px solid #5aa9ff;border-radius:50%}
.ctl svg{display:block;fill:currentColor;stroke:currentColor;stroke-linejoin:round}
.ctl svg.pause{stroke:none}
#bk{left:60px;top:164px}#pp{left:192px;top:164px}#fw{left:322px;top:164px}
.pp .ico{grid-area:1/1;transition:opacity .22s,scale .3s var(--ease-out)}
.pp .play{opacity:0;scale:.6}
.paused .pp .play{opacity:1;scale:1}.paused .pp .pause{opacity:0;scale:.6}

/* ---------- Demo chrome ---------- */
.demo{position:fixed;bottom:28px;left:50%;translate:-50% 0;display:flex;gap:8px;padding:6px;border-radius:999px;
  background:rgba(20,22,30,.55);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.demo button{font:600 14px var(--font);color:#fff;background:transparent;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .2s}
.demo button[aria-pressed=true]{background:rgba(255,255,255,.22)}
.demo button:focus-visible{outline:2px solid #5aa9ff}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;transform:scaleY(.6)}}
</style>
</head>
<body>
<div class="wall"></div>

<div id="isl" class="island" data-state="idle" role="button" tabindex="0" aria-label="Dynamic Island" aria-expanded="false">
  <div class="layer compact" aria-hidden="true">
    <div class="art"></div>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="layer full" inert>
    <div class="art"></div>
    <div class="title">Going to Babble On</div>
    <div class="artist">The Strokes</div>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="t" id="tc">2:35</span><span class="t" id="tr">−1:31</span>
    <div class="bar" id="bar" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="246" aria-valuenow="155" tabindex="0">
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="ctl" id="bk" aria-label="Rewind"><svg width="48" height="30" viewBox="0 0 48 30" stroke-width="4"><path d="M23 3 4 15l19 12ZM45 3 26 15l19 12Z"/></svg></button>
    <button class="ctl pp" id="pp" aria-label="Pause">
      <svg class="ico pause" width="36" height="48" viewBox="0 0 36 48" stroke="none"><rect width="14" height="48" rx="4"/><rect x="22" width="14" height="48" rx="4"/></svg>
      <svg class="ico play" width="38" height="48" viewBox="0 0 38 48" stroke-width="8"><path d="M6 6 33 24 6 42Z"/></svg>
    </button>
    <button class="ctl" id="fw" aria-label="Fast forward"><svg width="48" height="30" viewBox="0 0 48 30" stroke-width="4"><path d="M3 3l19 12L3 27ZM25 3l19 12-19 12Z"/></svg></button>
  </div>
</div>

<div class="demo" dir="rtl" role="group" aria-label="حالات الجزيرة">
  <button data-go="idle" aria-pressed="true">خامل</button>
  <button data-go="compact" aria-pressed="false">موسيقى</button>
  <button data-go="full" aria-pressed="false">موسّع</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const isl = $('#isl'), fill = $('#fill'), tc = $('#tc'), tr = $('#tr'), bar = $('#bar'), pp = $('#pp');
  const DUR = 246, fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  let state = 'idle', playing = true, cur = 155, scrub = false;

  /* Spring engine — k = stiffness, c = damping (mass 1). Velocity is preserved when the target changes,
     so interrupting an open/close mid-flight stays fluid, like the system animation. */
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mk = (x, k, c) => ({ x, v: 0, t: x, k, c: RM ? 2*Math.sqrt(k) : c });
  const S = { w: mk(64, 300, 28), h: mk(34, 260, 25), r: mk(17, 320, 30) };
  const TARGET = { idle: [64, 34, 17], compact: [144, 34, 17], full: [480, 262, 46] };
  let raf = 0, last = 0;

  function apply() {
    isl.style.width = S.w.x + 'px';
    isl.style.height = Math.max(S.h.x, 20) + 'px';
    isl.style.borderRadius = Math.max(S.r.x, 8) + 'px';
    isl.style.setProperty('--p', Math.min(1, Math.max(0, (S.h.x - 34) / 228)).toFixed(3));
  }
  function tick(now) {
    const dt = Math.min(.032, (now - last) / 1000); last = now;
    let moving = false;
    for (const p of Object.values(S)) {
      p.v += (-p.k * (p.x - p.t) - p.c * p.v) * dt;
      p.x += p.v * dt;
      if (Math.abs(p.v) > .05 || Math.abs(p.x - p.t) > .05) moving = true; else if (!moving) { }
    }
    apply();
    raf = moving ? requestAnimationFrame(tick) : 0;
    if (!moving) { for (const p of Object.values(S)) { p.x = p.t; p.v = 0; } apply(); }
  }
  function go(next) {
    state = next;
    isl.dataset.state = next;
    isl.setAttribute('aria-expanded', next === 'full');
    $('.layer.full').inert = next !== 'full';
    [S.w.t, S.h.t, S.r.t] = TARGET[next];
    document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-pressed', b.dataset.go === next));
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }

  /* Interaction */
  const order = ['idle', 'compact', 'full'];
  isl.addEventListener('pointerdown', e => { if (!e.target.closest('.ctl,.bar')) isl.classList.add('press'); });
  addEventListener('pointerup', () => isl.classList.remove('press'));
  isl.addEventListener('click', e => {
    if (e.target.closest('.ctl,.bar')) return;
    go(state === 'full' ? 'compact' : state === 'compact' ? 'full' : 'compact');
  });
  isl.addEventListener('keydown', e => { if (e.target === isl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); isl.click(); } });
  addEventListener('keydown', e => { if (e.key === 'Escape' && state !== 'idle') go(order[order.indexOf(state) - 1]); });
  document.addEventListener('pointerdown', e => { if (state === 'full' && !isl.contains(e.target) && !e.target.closest('.demo')) go('compact'); });
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

  /* Player */
  function render() {
    tc.textContent = fmt(cur); tr.textContent = '−' + fmt(DUR - cur);
    fill.style.width = (cur / DUR * 100) + '%'; bar.setAttribute('aria-valuenow', Math.round(cur));
  }
  pp.addEventListener('click', () => {
    playing = !playing; isl.classList.toggle('paused', !playing);
    pp.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  });
  $('#bk').addEventListener('click', () => { cur = Math.max(0, cur - 15); render(); });
  $('#fw').addEventListener('click', () => { cur = Math.min(DUR, cur + 15); render(); });
  const seek = e => { const r = bar.getBoundingClientRect(); cur = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * DUR; render(); };
  bar.addEventListener('pointerdown', e => { scrub = true; bar.setPointerCapture(e.pointerId); bar.classList.add('on'); seek(e); });
  bar.addEventListener('pointermove', e => { if (scrub) seek(e); });
  const end = () => { scrub = false; bar.classList.remove('on'); };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
  bar.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { cur = Math.min(DUR, cur + 5); render(); }
    if (e.key === 'ArrowLeft') { cur = Math.max(0, cur - 5); render(); }
  });
  setInterval(() => { if (playing && !scrub && cur < DUR) { cur = Math.min(DUR, cur + .25); render(); } }, 250);

  const fit = () => document.documentElement.style.setProperty('--fit', Math.min(1, (innerWidth - 16) / 480).toFixed(3));
  addEventListener('resize', fit); fit();

  apply(); render();
  setTimeout(() => go('compact'), 700);
  setTimeout(() => go('full'), 2000);
})();
</script>
</body>
</html>
