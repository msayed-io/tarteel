<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شريط تَرتيل</title>
<style>
:root{
  --text:#fff;--sub:rgba(235,235,245,.62);--faint:rgba(235,235,245,.34);
  --surface:rgba(0,0,0,.34);--hover:rgba(255,255,255,.12);--active:rgba(255,255,255,.22);
  --green:#30d158;--orange:#ff9f0a;--blue:#0a84ff;--red:#ff453a;--accent:#b88ad8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:stretch;user-select:none}

/* الشريط شفاف بالكامل: لا خلفية، لا خط فاصل، لا ظل، لا حدود.
   الخلفية التي تراها هي خلفية سطح المكتب كما هي. كل عنصر يحمل سطحه
   الداكن الصغير ليظل مقروءًا فوق أي خلفية، دون أن يقطع الشريطَ خطٌّ ما. */
.bar{
  flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  height:100%;padding:0 8px;gap:8px;
  background:transparent;
}

/* ---------- اليمين: مراقبات + مركز تحكم + ساعة ---------- */
.right{display:flex;align-items:center;gap:6px;justify-content:flex-start;min-width:0}
.chip{
  display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;
  background:var(--surface);font-size:11px;line-height:1;white-space:nowrap;
  transition:background .16s var(--ease),transform .16s var(--ease);
}
.chip:hover{background:rgba(0,0,0,.5)}
.chip svg{width:12px;height:12px;flex:none;opacity:.9}
.chip .val{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.2px}
.chip .unit{opacity:.5;font-size:9px}
.meter{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;flex:none}
.meter i{display:block;height:100%;border-radius:2px;background:var(--green);transition:width .3s var(--ease),background .3s ease}
.meter.hot i{background:var(--orange)}
.meter.crit i{background:var(--red)}
.net{font-variant-numeric:tabular-nums;font-size:10px;opacity:.8;display:flex;flex-direction:column;line-height:1.15}
.net b{font-weight:600}
.privacy{display:flex;gap:4px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;opacity:0;transition:opacity .2s ease,transform .2s ease;transform:scale(.4)}
.dot.on{opacity:1;transform:scale(1)}
.dot.cam{background:var(--green);box-shadow:0 0 6px rgba(48,209,88,.7)}
.dot.mic{background:var(--orange);box-shadow:0 0 6px rgba(255,159,10,.7)}

/* مركز التحكم المصغر */
.mini{display:flex;align-items:center;gap:4px}
.mbtn{
  display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:6px;
  background:var(--surface);color:var(--text);cursor:pointer;
  transition:background .16s var(--ease),transform .1s ease;
}
.mbtn:hover{background:rgba(0,0,0,.5)}
.mbtn:active{transform:scale(.92)}
.mbtn svg{width:13px;height:13px;pointer-events:none}
.mbtn.off{opacity:.4}
.slider{
  -webkit-appearance:none;appearance:none;width:56px;height:22px;background:transparent;cursor:pointer;
}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;margin-top:-3px;
  box-shadow:0 1px 3px rgba(0,0,0,.4);
}

/* الساعة والتاريخ */
.clock{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;padding-inline-start:4px;white-space:nowrap}
.clock .time{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.clock .date{font-size:9px;opacity:.62;text-shadow:0 1px 3px rgba(0,0,0,.85)}

/* ---------- الوسط: مكان الجزيرة (شعار فقط، الجزيرة نافذة مستقلة فوقها) ---------- */
.mid{display:flex;align-items:center;justify-content:center;height:100%;min-width:calc(var(--island-w,120px) + 20px);transition:min-width .28s var(--ease)}

/* ---------- اليسار: التطبيق النشط + أزرار النافذة ---------- */
.left{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0}
.app{
  display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;
  background:var(--surface);font-size:11px;max-width:190px;min-width:0;
}
.app .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.app svg{width:12px;height:12px;flex:none;opacity:.7}
.app:hover{background:rgba(0,0,0,.5)}
.wbtns{display:flex;gap:2px}
.wbtn{
  display:grid;place-items:center;width:26px;height:22px;border:0;border-radius:5px;
  color:var(--sub);cursor:pointer;transition:background .14s ease,color .14s ease;
}
.wbtn{background:var(--surface)}
.wbtn:hover{background:rgba(0,0,0,.5);color:var(--text)}
.wbtn.close:hover{background:#c42b1c;color:#fff}
.wbtn svg{width:12px;height:12px;pointer-events:none}

/* شبكة أمان: أي عنصر يفشل تحميله لا يكسر الشريط */
.hidden{display:none!important}
@media (max-width:900px){.chip.uptime,.chip.procs,.clock .date{display:none}}
@media (max-width:700px){.slider{display:none}}
</style>
</head>
<body>
<div class="bar" id="bar">

  <!-- اليمين -->
  <div class="right">
    <div class="chip" id="chipCpu" title="المعالج">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
      <span class="val" id="cpuVal">—</span><span class="unit">%</span>
    </div>
    <div class="chip" id="chipRam" title="الذاكرة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 17v3M12 17v3M17 17v3"/></svg>
      <div class="meter" id="ramMeter"><i style="width:0%"></i></div>
      <span class="val" id="ramVal">—</span><span class="unit">%</span>
    </div>
    <div class="chip" id="chipNet" title="الشبكة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5a10 10 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 19.5h.01M2 9a15 15 0 0 1 20 0"/></svg>
      <span class="net"><b id="netDown">—</b><span id="netUp">—</span></span>
    </div>

    <div class="mini">
      <button class="mbtn" id="volDown" title="خفض الصوت" aria-label="خفض الصوت">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9v6h4l5 4V5L9 9H5z"/></svg>
      </button>
      <input class="slider" id="vol" type="range" min="0" max="100" value="50" title="مستوى الصوت" aria-label="مستوى الصوت">
      <button class="mbtn" id="volUp" title="رفع الصوت" aria-label="رفع الصوت">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9v6h4l5 4V5L9 9H5zM17 9a4 4 0 0 1 0 6M20 6a8 8 0 0 1 0 12"/></svg>
      </button>
      <button class="mbtn" id="mute" title="كتم الصوت" aria-label="كتم الصوت">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9v6h4l5 4V5L9 9H5zM17 9l4 6M21 9l-4 6"/></svg>
      </button>
    </div>

    <div class="mini">
      <button class="mbtn" id="brDown" title="خفض السطوع" aria-label="خفض السطوع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
      </button>
      <input class="slider" id="bright" type="range" min="10" max="100" value="100" title="السطوع" aria-label="السطوع">
      <button class="mbtn" id="brUp" title="رفع السطوع" aria-label="رفع السطوع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
      </button>
    </div>

    <div class="chip hidden" id="chipWifi" title="شبكة الواي فاي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5a10 10 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 19.5h.01M2 9a15 15 0 0 1 20 0"/></svg>
      <span class="name" id="wifiName"></span>
    </div>

    <div class="chip hidden" id="chipBatt" title="البطارية">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21 10v4"/></svg>
      <span class="val" id="battVal">—</span><span class="unit">%</span>
      <svg id="battBolt" class="hidden" viewBox="0 0 24 24" fill="currentColor" style="color:var(--green)"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </div>

    <div class="privacy">
      <span class="dot cam" id="dotCam" title="الكاميرا قيد الاستخدام"></span>
      <span class="dot mic" id="dotMic" title="الميكروفون قيد الاستخدام"></span>
    </div>

    <div class="clock">
      <span class="time" id="clockTime">—</span>
      <span class="date" id="clockDate">—</span>
    </div>
  </div>

  <!-- الوسط: مكان الجزيرة -->
  <div class="mid" id="mid" aria-hidden="true"></div>

  <!-- اليسار -->
  <div class="left">
    <div class="app" id="appChip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <span class="name" id="appName">سطح المكتب</span>
    </div>
    <div class="wbtns">
      <button class="wbtn" id="wMin" title="تصغير" aria-label="تصغير النافذة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button class="wbtn" id="wMax" title="تكبير" aria-label="تكبير النافذة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
      </button>
      <button class="wbtn close" id="wClose" title="إغلاق" aria-label="إغلاق النافذة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
/* كل قيمة تأتي من الخلفية. أي فشل يُظهر «—» ولا يخترع رقمًا. */
const $ = id => document.getElementById(id);
const invoke = (cmd, args) => window.__TAURI__?.core?.invoke(cmd, args) ?? Promise.reject(new Error('no tauri'));
const listen = (name, cb) => window.__TAURI__?.event?.listen(name, cb) ?? Promise.resolve(() => {});

const AR_NUM = new Intl.NumberFormat('ar-EG', { useGrouping: false });
const toAr = n => AR_NUM.format(n);
const setText = (node, text) => { if (node && node.textContent !== text) node.textContent = text; };

/* ---------- الساعة: تتحدث كل ثانية، بالعربية دائمًا ---------- */
const timeFmt = new Intl.DateTimeFormat('ar-EG', { hour: 'numeric', minute: '2-digit', hourCycle: 'h12' });
const dateFmt = new Intl.DateTimeFormat('ar-EG', { weekday: 'short', day: 'numeric', month: 'short' });
function tickClock() {
  const now = new Date();
  setText($('clockTime'), timeFmt.format(now));
  setText($('clockDate'), dateFmt.format(now));
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- رسم القيم ---------- */
function pctClass(value) {
  if (value >= 85) return 'crit';
  if (value >= 65) return 'hot';
  return '';
}

function render(s) {
  if (!s) return;

  if (Number.isFinite(s.cpu)) {
    setText($('cpuVal'), toAr(Math.round(s.cpu)));
  } else {
    setText($('cpuVal'), '—');
  }

  if (Number.isFinite(s.ram)) {
    setText($('ramVal'), toAr(Math.round(s.ram)));
    const meter = $('ramMeter');
    meter.firstElementChild.style.width = Math.min(100, Math.max(0, s.ram)) + '%';
    meter.className = 'meter ' + pctClass(s.ram);
  } else {
    setText($('ramVal'), '—');
  }

  const down = Number.isFinite(s.net_down_kbps) ? s.net_down_kbps : null;
  const up = Number.isFinite(s.net_up_kbps) ? s.net_up_kbps : null;
  setText($('netDown'), down === null ? '—' : toAr(Math.round(down)) + ' ↓');
  setText($('netUp'), up === null ? '' : toAr(Math.round(up)) + ' ↑');

  $('chipWifi').classList.toggle('hidden', !s.wifi);
  if (s.wifi && s.wifi_name) setText($('wifiName'), s.wifi_name);

  if (s.has_battery && Number.isFinite(s.battery)) {
    $('chipBatt').classList.remove('hidden');
    setText($('battVal'), toAr(Math.round(s.battery)));
    $('battBolt').classList.toggle('hidden', !s.charging);
  } else {
    $('chipBatt').classList.add('hidden');
  }

  if (Number.isFinite(s.volume)) {
    const slider = $('vol');
    if (document.activeElement !== slider) slider.value = Math.round(s.volume);
  }
  $('mute').classList.toggle('off', Boolean(s.muted));

  if (Number.isFinite(s.brightness)) {
    const slider = $('bright');
    if (document.activeElement !== slider) slider.value = Math.round(s.brightness);
  }

  $('dotCam').classList.toggle('on', Boolean(s.camera_in_use));
  $('dotMic').classList.toggle('on', Boolean(s.mic_in_use));

  const name = s.app_name || 'سطح المكتب';
  setText($('appName'), name);
  $('appChip').title = name;
  $('wMax').title = s.maximized ? 'استعادة' : 'تكبير';
  $('wMax').setAttribute('aria-label', s.maximized ? 'استعادة النافذة' : 'تكبير النافذة');
}

/* ---------- الأوامر ---------- */
const send = (cmd, args) => invoke(cmd, args).catch(err => console.error('Tarteel bar command failed', cmd, err));

$('volUp').onclick = () => send('bar_volume', { direction: 'up' });
$('volDown').onclick = () => send('bar_volume', { direction: 'down' });
$('mute').onclick = () => send('bar_volume', { direction: 'mute' });
$('vol').oninput = e => send('bar_set_volume', { percent: Number(e.target.value) });

$('brUp').onclick = () => send('bar_brightness', { delta: 10 });
$('brDown').onclick = () => send('bar_brightness', { delta: -10 });
$('bright').oninput = e => send('bar_set_brightness', { percent: Number(e.target.value) });

$('wMin').onclick = () => send('bar_window', { action: 'minimize' });
$('wMax').onclick = () => send('bar_window', { action: 'maximize' });
$('wClose').onclick = () => send('bar_window', { action: 'close' });

/* ---------- دورة التحديث ----------
   ثانية واحدة للشريط كله: الأرقام تتحرك بسلاسة ولا نستهلك معالجًا في
   قياس المعالج — وهو ما كان سيحدث لو قسنا أسرع من ذلك. */
let busy = false;
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    render(await invoke('bar_snapshot'));
  } catch (err) {
    console.error('Tarteel bar snapshot failed', err);
  } finally {
    busy = false;
  }
}
refresh();
setInterval(refresh, 1000);

/* عرض المنطقة الوسطى يتبع حالة الجزيرة، فلا يمرّ نصّ الشريط تحتها
   عندما تتوسّع إلى المشغّل أو المواقيت. */
const ISLAND_WIDTH = { idle: 56, compact: 126, full: 384, prayer: 444, tools: 480, alert: 440 };
listen('island-state', event => {
  const width = ISLAND_WIDTH[event?.payload?.state] || 120;
  document.documentElement.style.setProperty('--island-w', width + 'px');
}).catch(() => {});
</script>
</body>
</html>
