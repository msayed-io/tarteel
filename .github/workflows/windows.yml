name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run test
      - run: npm run build
  windows:
    needs: test
    runs-on: windows-2025
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0-x86_64-pc-windows-msvc}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: tarteel-v__VERSION__
          releaseName: Tarteel v__VERSION__
          releaseBody: |
            Keeps the Dynamic Island capsule anchored during expansion and collapse, with Windows motion-frame verification.
            Refines the compact idle/music silhouette and reduces expanded states by 10% while preserving their internal layout.
            Constrains the native input region to the capsule while collapsed; includes measured geometry and click-through smoke verification.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
      - name: Interactive island geometry smoke test
        shell: pwsh
        run: ./scripts/windows-island-smoke.ps1 -ExePath ./src-tauri/target/release/tarteel.exe
      - name: Upload island screenshots and geometry log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarteel-island-ui-smoke
          path: artifacts/island-ui-smoke/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tarteel-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
